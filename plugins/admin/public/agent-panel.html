<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Management</title>
<style>
:root{--bg:#fbfbfa;--surface:#fff;--text:#18181b;--muted:#667085;--border:#e4e7ec;--accent:#0f766e;--radius:8px}
*{box-sizing:border-box}body{margin:0;font:14px/1.6 system-ui,sans-serif;background:var(--bg);color:var(--text)}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;gap:16px;align-items:center;position:sticky;top:0;z-index:10}
.tab{padding:8px 16px;cursor:pointer;border-radius:var(--radius);font-weight:500}
.tab.active{background:var(--accent);color:#fff}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin:12px 0}
.card h3{margin:0 0 8px 0}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
.badge.online{background:#d1fae5;color:#065f46}.badge.draft{background:#f3f4f6;color:#6b7280}.badge.error{background:#fee2e2;color:#991b1b}
.btn{padding:6px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);cursor:pointer;font-size:13px}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.loading{color:var(--muted);text-align:center;padding:40px}
</style>
</head>
<body>
<div class="header">
  <span style="font-weight:700;font-size:16px">Agent Gateway</span>
  <span class="tab active" data-tab="agents">Agents</span>
  <span class="tab" data-tab="sopruns">SOP Runs</span>
  <span class="tab" data-tab="templates">Templates</span>
</div>
<div id="content" class="loading">Loading...</div>
<script>
var WS = "org:acme";

// -- delegation: no inline onclick --
document.getElementById("content").addEventListener("click", function(e) {
  var a = e.target.closest("[data-action]");
  if (!a) return;
  var action = a.dataset.action;
  if (action === "create-agent") { var n = prompt("Agent name:"); if (n) createAgent(n); }
  else if (action === "from-template") { var n = prompt("Name:"); if (n) createAgent(n); }
});

document.querySelectorAll(".tab").forEach(function(t) {
  t.addEventListener("click", function() {
    document.querySelectorAll(".tab").forEach(function(x) { x.classList.remove("active"); });
    t.classList.add("active");
    var tab = t.dataset.tab;
    if (tab === "agents") loadAgents();
    else if (tab === "sopruns") loadSopRuns();
    else loadTemplates();
  });
});

function createAgent(name) {
  var id = name.toLowerCase().replace(/[^a-z0-9-]/g,"-");
  fetch("/api/agents/workspaces/" + WS + "/agents", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ id: id, name: name, template: "custom" })
  }).then(function(r) { return r.json(); }).then(function(d) {
    alert(d.id ? "Created: " + d.id : "Failed");
    loadAgents();
  });
}

function loadAgents() {
  var c = document.getElementById("content");
  fetch("/api/agents/workspaces/" + WS + "/agents")
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var agents = data.agents || [];
      if (!agents.length) { c.innerHTML = '<div class="card"><p>No agents yet. <a href="#" data-action="create-agent">Create one</a></p></div>'; return; }
      c.innerHTML = agents.map(function(a) {
        return '<div class="card"><h3>' + (a.name || a.id) + ' <span class="badge ' + (a.status||"") + '">' + (a.status||"") + '</span></h3>' +
               '<p>' + a.id + ' · harness: ' + (a.harness||"?") + ' · model: ' + ((a.model&&a.model.primary)||"?") + ' · v' + (a.version||1) + '</p></div>';
      }).join("");
    }).catch(function(e) { c.innerHTML = '<div class="card"><p>API unavailable</p></div>'; });
}

function loadSopRuns() {
  var c = document.getElementById("content");
  fetch("/api/agents/workspaces/" + WS + "/sop-runs")
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var runs = data.runs || [];
      if (!runs.length) { c.innerHTML = '<div class="card"><p>No SOP runs yet.</p></div>'; return; }
      c.innerHTML = runs.map(function(r) {
        return '<div class="card"><h3>' + (r.modelId||"") + ' <span class="badge ' + (r.status||"") + '">Gate ' + (r.currentGate||0) + '/5</span></h3>' +
               '<p>' + r.id + ' · agent: ' + (r.agentId||"") + ' · ' + new Date(r.updatedAt).toLocaleDateString() + '</p></div>';
      }).join("");
    }).catch(function(e) { c.innerHTML = '<div class="card"><p>API unavailable.</p></div>'; });
}

function loadTemplates() {
  var c = document.getElementById("content");
  fetch("/api/agent-templates")
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var tmpl = data.templates || [];
      c.innerHTML = tmpl.map(function(t) {
        return '<div class="card"><h3>' + (t.name||"") + ' (' + (t.id||"") + ')</h3><p>' + (t.description||"") + '</p>' +
               '<button class="btn primary" data-action="from-template" data-template="' + t.id + '">Create ' + (t.name||"") + '</button></div>';
      }).join("");
    }).catch(function(e) { c.innerHTML = '<div class="card"><p>Templates API unavailable.</p></div>'; });
}

loadAgents();
</script>
</body>
</html>
