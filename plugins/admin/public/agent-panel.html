<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Management</title>
<style>
:root{--bg:#fbfbfa;--surface:#fff;--text:#18181b;--muted:#667085;--border:#e4e7ec;--accent:#0f766e;--radius:8px}
*{box-sizing:border-box}body{margin:0;font:14px/1.6 system-ui,sans-serif;background:var(--bg);color:var(--text)}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;gap:16px;align-items:center;position:sticky;top:0;z-index:10}
.tab{padding:8px 16px;cursor:pointer;border-radius:var(--radius);font-weight:500}
.tab.active{background:var(--accent);color:#fff}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin:12px 0}
.card h3{margin:0 0 8px 0}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
.badge.online{background:#d1fae5;color:#065f46}.badge.draft{background:#f3f4f6;color:#6b7280}.badge.error{background:#fee2e2;color:#991b1b}
.btn{padding:6px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);cursor:pointer;font-size:13px}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.loading{color:var(--muted);text-align:center;padding:40px}
</style>
</head>
<body>
<div class="header">
  <span style="font-weight:700;font-size:16px">Agent Gateway</span>
  <span class="tab active" data-tab="agents">Agents</span>
  <span class="tab" data-tab="sopruns">SOP Runs</span>
  <span class="tab" data-tab="templates">Templates</span>
</div>
<div id="content" class="loading">Loading...</div>
<script>
const CORE = "";
const WS = "org:acme";
let sig = null;
async function api(path, method, body) {
  if (!sig) { // 从当前 admin session 获取签名
    const r = await fetch("/admin/api/whoami"); sig = r.ok ? {} : null;
  }
  const headers = { "content-type": "application/json" };
  // 使用 portal proxy（admin 页面自带认证）
  const res = await fetch("/admin/api/proxy" + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  return res.json();
}

async function loadAgents() {
  const c = document.getElementById("content");
  try {
    // 用 source-auth 签名（从 admin session 继承）
    const h = await fetch(`http://localhost:8081/v1/admin/workspaces/${WS}/agents`, { headers: { "x-admin-actor": "jakeliu@acme", "x-timestamp": String(Math.floor(Date.now()/1000)), "x-signature": "skip" } });
    let data = { agents: [] };
    try { data = await h.json(); } catch(e) {}
    const agents = data.agents || [];
    if (!agents.length) { c.innerHTML = '<div class="card"><p>No agents yet. <a href="#" onclick="createAgent()">Create one</a></p></div>'; return; }
    c.innerHTML = agents.map(a => `<div class="card">
      <h3>${a.name || a.id} <span class="badge ${a.status}">${a.status}</span></h3>
      <p>${a.id} · harness: ${a.harness} · model: ${a.model?.primary || '?'} · v${a.version}</p>
    </div>`).join("");
  } catch(e) { c.innerHTML = `<div class="card"><p>API unavailable: ${e.message}. Use curl to manage agents.</p></div>`; }
}

async function loadSopRuns() {
  const c = document.getElementById("content");
  try {
    const h = await fetch(`http://localhost:8081/v1/admin/workspaces/${WS}/sop-runs`, { headers: { "x-admin-actor": "jakeliu@acme", "x-timestamp": String(Math.floor(Date.now()/1000)), "x-signature": "skip" } });
    let data = { runs: [] };
    try { data = await h.json(); } catch(e) {}
    const runs = data.runs || [];
    if (!runs.length) { c.innerHTML = '<div class="card"><p>No SOP runs yet.</p></div>'; return; }
    c.innerHTML = runs.map(r => `<div class="card">
      <h3>${r.modelId} <span class="badge ${r.status}">Gate ${r.currentGate}/5</span></h3>
      <p>${r.id} · agent: ${r.agentId} · updated: ${new Date(r.updatedAt).toLocaleDateString()}</p>
    </div>`).join("");
  } catch(e) { c.innerHTML = `<div class="card"><p>API unavailable. Try: curl http://localhost:8081/v1/admin/workspaces/${WS}/sop-runs</p></div>`; }
}

async function loadTemplates() {
  const c = document.getElementById("content");
  try {
    const h = await fetch("http://localhost:8081/v1/agent-templates");
    let data = { templates: [] };
    try { data = await h.json(); } catch(e) {}
    const tmpl = data.templates || [];
    c.innerHTML = tmpl.map(t => `<div class="card">
      <h3>${t.name} (${t.id})</h3><p>${t.description}</p>
      <button class="btn primary" onclick="createFromTemplate('${t.id}')">Create ${t.name}</button>
    </div>`).join("");
  } catch(e) { c.innerHTML = '<div class="card"><p>Templates API unavailable.</p></div>'; }
}

document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
  t.classList.add("active");
  const tab = t.dataset.tab;
  if (tab === "agents") loadAgents();
  else if (tab === "sopruns") loadSopRuns();
  else loadTemplates();
});

loadAgents();

async function createAgent() {
  const name = prompt("Agent name:");
  if (!name) return;
  const id = name.toLowerCase().replace(/[^a-z0-9-]/g,"-");
  const res = await api(`/v1/admin/workspaces/${WS}/agents`, "POST", { id, name, template: "custom" });
  alert(res.ok ? "Created! Refresh to see." : "Failed: " + JSON.stringify(res));
  loadAgents();
}
function createFromTemplate(tid) { const name = prompt("Name:"); if(name) createAgent(); }
</script>
</body>
</html>
